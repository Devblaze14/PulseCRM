<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <style>
      .box{rx:14;ry:14;stroke-width:2;}
      .title{font-size:17px;font-weight:700;fill:#0f172a;}
      .sub{font-size:12px;fill:#475569;}
      .lbl{font-size:12px;fill:#334155;font-weight:600;}
      .step{font-size:12.5px;fill:#1e293b;}
      .stepnum{font-size:13px;font-weight:700;fill:#fff;}
      .badge{font-size:11px;fill:#fff;font-weight:700;}
    </style>
  </defs>

  <!-- Title -->
  <text x="40" y="40" font-size="24" font-weight="800" fill="#0f172a">PulseCRM — how the pieces talk</text>
  <text x="40" y="64" font-size="13.5" fill="#64748b">A marketer types plain English → AI builds a segment + message → human confirms → campaign sends → results stream back live.</text>

  <!-- ============ FRONTEND ============ -->
  <rect x="40" y="110" width="220" height="120" class="box" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="142" class="title">🖥️ Frontend</text>
  <text x="60" y="164" class="sub">React + Vite + TypeScript</text>
  <text x="60" y="182" class="sub">Tailwind + Recharts</text>
  <text x="60" y="206" class="sub">The dashboard &amp; chat builder</text>
  <text x="60" y="222" class="sub" font-style="italic">→ deploys to Vercel</text>

  <!-- ============ CRM API ============ -->
  <rect x="350" y="110" width="240" height="160" class="box" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="372" y="142" class="title">⚙️ CRM API</text>
  <text x="372" y="164" class="sub">Python · FastAPI · SQLModel</text>
  <text x="372" y="186" class="sub">• Segments (validate + compile)</text>
  <text x="372" y="204" class="sub">• Campaigns &amp; sending</text>
  <text x="372" y="222" class="sub">• Receipts (idempotent)</text>
  <text x="372" y="240" class="sub">• Stats</text>
  <text x="372" y="261" class="sub" font-style="italic">→ deploys to Render</text>

  <!-- ============ CHANNEL ============ -->
  <rect x="680" y="110" width="200" height="160" class="box" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="702" y="142" class="title">📨 Channel</text>
  <text x="702" y="164" class="sub">Python · FastAPI · asyncio</text>
  <text x="702" y="186" class="sub">A FAKE messaging</text>
  <text x="702" y="204" class="sub">provider (WhatsApp/SMS).</text>
  <text x="702" y="222" class="sub">Simulates delivery,</text>
  <text x="702" y="240" class="sub">opens, clicks…</text>
  <text x="702" y="261" class="sub" font-style="italic">→ deploys to Render</text>

  <!-- ============ GROQ ============ -->
  <rect x="350" y="330" width="240" height="86" class="box" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="372" y="362" class="title">🤖 Groq LLM</text>
  <text x="372" y="384" class="sub">Turns English → segment JSON,</text>
  <text x="372" y="402" class="sub">drafts messages, summarises stats.</text>

  <!-- ============ DATABASE ============ -->
  <rect x="350" y="470" width="240" height="86" class="box" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="372" y="502" class="title">🗄️ Supabase Postgres</text>
  <text x="372" y="524" class="sub">Customers, orders, campaigns,</text>
  <text x="372" y="542" class="sub">messages, and the event log.</text>

  <!-- ===== arrows: frontend <-> api ===== -->
  <line x1="260" y1="158" x2="346" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="268" y="150" class="lbl">HTTP / JSON</text>
  <line x1="346" y1="196" x2="262" y2="196" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="272" y="214" class="sub">data back</text>

  <!-- ===== arrows: api -> channel (send) ===== -->
  <line x1="590" y1="158" x2="676" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="150" class="lbl">POST /send</text>
  <text x="596" y="172" class="sub">(batch of messages)</text>

  <!-- ===== arrows: channel -> api (callbacks) ===== -->
  <path d="M676,212 C620,250 650,250 594,212" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="600" y="258" font-size="12" fill="#6366f1" font-weight="600">callbacks →</text>
  <text x="600" y="274" font-size="11.5" fill="#6366f1">/api/receipts</text>

  <!-- ===== api <-> groq ===== -->
  <line x1="470" y1="270" x2="470" y2="326" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="478" y="302" font-size="12" fill="#a855f7" font-weight="600">asks AI</text>

  <!-- ===== api <-> db ===== -->
  <line x1="470" y1="416" x2="470" y2="466" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="478" y="446" font-size="12" fill="#0ea5e9" font-weight="600">reads / writes</text>

  <!-- ===== the 4-step flow strip ===== -->
  <rect x="40" y="300" width="270" height="256" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="328" font-size="14" font-weight="800" fill="#0f172a">The send → results loop</text>

  <circle cx="70" cy="356" r="11" fill="#6366f1"/><text x="66" y="361" class="stepnum">1</text>
  <text x="90" y="354" class="step">Marketer confirms →</text>
  <text x="90" y="370" class="step" fill="#475569">create 1 message per customer,</text>
  <text x="90" y="385" class="step" fill="#475569">send batch to Channel.</text>

  <circle cx="70" cy="410" r="11" fill="#f97316"/><text x="66" y="415" class="stepnum">2</text>
  <text x="90" y="408" class="step">Channel replies 202 instantly,</text>
  <text x="90" y="423" class="step" fill="#475569">then simulates delivery over</text>
  <text x="90" y="438" class="step" fill="#475569">a few seconds.</text>

  <circle cx="70" cy="463" r="11" fill="#6366f1"/><text x="66" y="468" class="stepnum">3</text>
  <text x="90" y="461" class="step">Each event (delivered, opened,</text>
  <text x="90" y="476" class="step" fill="#475569">clicked…) calls back to the API,</text>
  <text x="90" y="491" class="step" fill="#475569">which updates the message status.</text>

  <circle cx="70" cy="516" r="11" fill="#10b981"/><text x="66" y="521" class="stepnum">4</text>
  <text x="90" y="514" class="step">Dashboard shows the funnel</text>
  <text x="90" y="529" class="step" fill="#475569">filling up live + an AI insight.</text>

  <!-- safety badges -->
  <rect x="620" y="320" width="260" height="236" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="640" y="348" font-size="14" font-weight="800" fill="#0f172a">Built to be correct</text>

  <rect x="640" y="364" width="220" height="40" rx="8" fill="#eef2ff"/>
  <text x="652" y="382" class="lbl">🔒 AI never writes SQL</text>
  <text x="652" y="398" class="sub">JSON filter → validated → bound params.</text>

  <rect x="640" y="414" width="220" height="40" rx="8" fill="#ecfdf5"/>
  <text x="652" y="432" class="lbl">♻️ Idempotent</text>
  <text x="652" y="448" class="sub">Duplicate callback = no double count.</text>

  <rect x="640" y="464" width="220" height="40" rx="8" fill="#fff7ed"/>
  <text x="652" y="482" class="lbl">↕️ Out-of-order safe</text>
  <text x="652" y="498" class="sub">Status only moves forward, never back.</text>

  <rect x="640" y="514" width="220" height="32" rx="8" fill="#fef2f2"/>
  <text x="652" y="534" class="lbl">✅ Human confirms before send</text>
</svg>
