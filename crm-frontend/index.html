<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mobile browser chrome matches the theme (dark navy default; light off-white). -->
    <meta name="theme-color" content="#06070d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f2f7" media="(prefers-color-scheme: light)" />
    <!-- Premium type pairing: Geist for headings & numbers (crisp, modern),
         Inter for body. Loaded via link (no npm dependency). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>PulseCRM — AI Marketing Assistant</title>
    <!-- Apply the saved theme (default light) before paint to avoid a dark→light
         flash. Mirrors getInitial() in src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pulsecrm-theme");
          if (saved === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          /* no saved preference / no storage access: keep the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
